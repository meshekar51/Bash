# =============================================================================
# 10 microservices, simplified, all in the DEFAULT namespace.
# Each microservice = 1 Deployment (1 replica) + 1 Service.
#
# Based on Istio's Bookinfo (details, ratings, reviews, productpage) and
# extended with 6 more bookstore services to reach 10.
#
# Simplifications vs the original Bookinfo file:
#   - no ServiceAccounts
#   - reviews collapsed to a single version (original had v1/v2/v3)
#   - no volumes / Prometheus annotations
#
# IMAGE NOTE: a placeholder image (nginx:alpine) is used for every service so
# the whole file runs identically out of the box. Swap in real images per
# service when you have them. The 4 Bookinfo services have real images you can
# use instead (commented next to each).
#
# Apply:   kubectl apply -f bookstore-10-microservices.yaml
# Verify:  kubectl get deploy,svc
# =============================================================================

# ---- 1) productpage (frontend) ----------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productpage
  namespace: default
  labels: { app: productpage }
spec:
  replicas: 1
  selector:
    matchLabels: { app: productpage }
  template:
    metadata:
      labels: { app: productpage }
    spec:
      containers:
        - name: productpage
          image: nginx:alpine   # real: registry.istio.io/release/examples-bookinfo-productpage-v1:1.20.3 (port 9080)
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: productpage
  namespace: default
  labels: { app: productpage }
spec:
  selector: { app: productpage }
  ports:
    - port: 80
      targetPort: 80
---
